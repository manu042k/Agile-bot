name: Manual Deploy to Azure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      component:
        description: 'Component to deploy'
        required: true
        default: 'both'
        type: choice
        options:
          - backend
          - frontend
          - both

env:
  AZURE_WEBAPP_BACKEND: agilebot-backend
  AZURE_WEBAPP_FRONTEND: agilebot-frontend
  CONTAINER_REGISTRY: agilebotacr2681.azurecr.io
  RESOURCE_GROUP: agilebot-rg

jobs:
  deploy-backend:
    if: ${{ github.event.inputs.component == 'backend' || github.event.inputs.component == 'both' }}
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Log in to Azure Container Registry
      uses: azure/docker-login@v1
      with:
        login-server: ${{ env.CONTAINER_REGISTRY }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build and push Backend Docker image
      working-directory: ./Backend
      run: |
        echo "Building backend image..."
        docker build -t ${{ env.CONTAINER_REGISTRY }}/agilebot-backend:${{ github.sha }} \
                     -t ${{ env.CONTAINER_REGISTRY }}/agilebot-backend:latest .
        echo "Pushing backend image..."
        docker push ${{ env.CONTAINER_REGISTRY }}/agilebot-backend:${{ github.sha }}
        docker push ${{ env.CONTAINER_REGISTRY }}/agilebot-backend:latest

    - name: Deploy Backend to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_BACKEND }}
        images: ${{ env.CONTAINER_REGISTRY }}/agilebot-backend:${{ github.sha }}

    - name: Restart Backend App
      run: |
        az webapp restart --name ${{ env.AZURE_WEBAPP_BACKEND }} --resource-group ${{ env.RESOURCE_GROUP }}
        echo "Backend restarted"

  deploy-frontend:
    if: ${{ github.event.inputs.component == 'frontend' || github.event.inputs.component == 'both' }}
    runs-on: ubuntu-latest
    needs: [deploy-backend]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Log in to Azure Container Registry
      uses: azure/docker-login@v1
      with:
        login-server: ${{ env.CONTAINER_REGISTRY }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build and push Frontend Docker image
      working-directory: ./NFrontend
      run: |
        echo "Building frontend image..."
        docker build \
          --build-arg NEXT_PUBLIC_API_URL=https://${{ env.AZURE_WEBAPP_BACKEND }}.azurewebsites.net \
          --build-arg NEXT_PUBLIC_WS_URL=wss://${{ env.AZURE_WEBAPP_BACKEND }}.azurewebsites.net \
          --build-arg NEXTAUTH_URL=https://${{ env.AZURE_WEBAPP_FRONTEND }}.azurewebsites.net \
          --build-arg NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }} \
          -f dockerfile \
          -t ${{ env.CONTAINER_REGISTRY }}/agilebot-frontend:${{ github.sha }} \
          -t ${{ env.CONTAINER_REGISTRY }}/agilebot-frontend:latest .
        echo "Pushing frontend image..."
        docker push ${{ env.CONTAINER_REGISTRY }}/agilebot-frontend:${{ github.sha }}
        docker push ${{ env.CONTAINER_REGISTRY }}/agilebot-frontend:latest

    - name: Deploy Frontend to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_FRONTEND }}
        images: ${{ env.CONTAINER_REGISTRY }}/agilebot-frontend:${{ github.sha }}

    - name: Restart Frontend App
      run: |
        az webapp restart --name ${{ env.AZURE_WEBAPP_FRONTEND }} --resource-group ${{ env.RESOURCE_GROUP }}
        echo "Frontend restarted"
