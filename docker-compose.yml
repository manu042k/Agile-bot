version: '3.8'

services:
  # Redis service for Celery broker and WebSocket channels
  redis:
    image: redis:7-alpine
    container_name: agilebot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Django backend service
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: agilebot-backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./Backend:/app
      - backend_media:/app/media
    ports:
      - "8000:8000"
    env_file:
      - ./Backend/.env
    environment:
      - REDIS_URI=redis://redis:6379
      - DEBUG=True
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/accounts/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Celery worker service
  celery:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: agilebot-celery
    command: celery -A agileBotApis worker --loglevel=info
    volumes:
      - ./Backend:/app
      - backend_media:/app/media
    env_file:
      - ./Backend/.env
    environment:
      - REDIS_URI=redis://redis:6379
      - DEBUG=True
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  # Frontend service
  frontend:
    build:
      context: ./NFrontend
      dockerfile: Dockerfile
    container_name: agilebot-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./NFrontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  redis_data:
  backend_media:
